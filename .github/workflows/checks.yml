name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: "1"
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run verify:apparatus
      - run: npm run build
      - run: npm run verify
      - run: npm run verify:publishing
